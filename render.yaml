services:
  - type: web
    name: medimart
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 10000
      - key: MEDIMART_DB_PATH
        value: /opt/render/project/src/data/medimart.db
    disk:
      name: medimart-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
